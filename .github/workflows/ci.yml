name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          # mongodb-memory-server (used by npm test) downloads a real MongoDB
          # binary on first use and caches it here by default — verified via
          # MONGOMS_DEBUG locally rather than assumed. Must run *after*
          # npm ci, not before: npm ci deletes and recreates node_modules
          # from scratch every run, which would wipe a cache restored
          # earlier in the job.
          path: backend/node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
